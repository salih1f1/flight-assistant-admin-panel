name: CI

# Every pull request, and every push to main — the second catches anything that reaches main
# without a pull request, which is how the build stayed broken for a day (#135). pull_request is
# left unfiltered on purpose: a stacked pull request, targeting another feature branch rather than
# main, needs checking just as much.
on:
  pull_request:
  push:
    branches: [main]
  # So a flaky failure can be re-run, or main re-checked, without an empty commit to trigger it.
  workflow_dispatch:

# A newer push to a pull request branch makes the running check's answer worthless. A run on main
# is not an answer to anything — it is the record of whether that commit built — so two merges in
# quick succession must not leave the first one unrecorded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, build and test
    runs-on: ubuntu-latest
    # Every step only reads the repository. Dropping the rest means a compromised dependency
    # running during npm ci or a test cannot push, open pull requests or publish with this token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # What the panel is developed on; npm's cache is keyed on package-lock.json.
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # The three checks run even when an earlier one has failed, so one run reports everything
      # that is wrong rather than handing them over one at a time. They are skipped only when the
      # run was cancelled, or when there are no dependencies to check anything against.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # tsc -b && vite build. vitest does not typecheck, so this is the only step that says
      # whether the app compiles at all — the check this workflow exists for.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test
